<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen 2 - Vista completa</title>
    <!-- Copia el mismo <style> de imagen1.html para mantener consistencia -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
            text-align: center;
            padding: 30px 10px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 2rem;
        }
        img {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 3px solid #444;
        }
        .volver {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: #f39c12;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background 0.3s;
        }
        .volver:hover {
            background: #e67e22;
        }
        .volver::before {
            content: "← ";
        }
    </style>
</head>
<body>
    <h2>Imagen 2</h2>
    <img src="./imagenes/imagen2.webp" alt="Atardecer en la playa">
    <a href="./galeria.html" class="volver">Volver a la galería</a>
</body>
</html>
