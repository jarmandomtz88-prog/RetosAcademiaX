<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Div, Span y Atributos</title>
    <!-- Estilos opcionales para visualizar mejor la estructura -->
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f9f9f9;
        }
        .contenedor {
            background: #e0f0ff;
            padding: 15px;
            border: 1px solid #0077cc;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .destacado {
            background-color: #ffdd99;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }
        p {
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Título principal (como aparece en la imagen) -->
    <h1>Ejemplo de HTML con Div, Span y Atributos</h1>

    <!-- Div con ID y Clase -->
    <div id="miDiv" class="contenedor">
        Este es un div con algunos atributos, como un ID y una clase.
        <span class="destacado">Este es un span dentro del div.</span>
    </div>

    <!-- Párrafo fuera del div -->
    <p>This is a paragraph that is not inside the div.</p>

</body>
</html>
