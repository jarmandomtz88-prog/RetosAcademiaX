<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Formularios</title>
</head>
<body>

    <h1>Formularios en HTML</h1>

    <form action="#" method="post">
        <!-- Datos Personales -->
        <h2>Datos Personales</h2>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono"><br><br>

        <!-- Género -->
        <h2>Género</h2>
        <input type="radio" id="masculino" name="genero" value="masculino">
        <label for="masculino">Masculino</label><br>
        <input type="radio" id="femenino" name="genero" value="femenino">
        <label for="femenino">Femenino</label><br>
        <input type="radio" id="otro" name="genero" value="otro">
        <label for="otro">Otro</label><br><br>

        <!-- Preferencias -->
        <h2>Preferencias</h2>
        <input type="checkbox" id="musica" name="preferencias[]" value="musica">
        <label for="musica">Música</label><br>
        <input type="checkbox" id="deportes" name="preferencias[]" value="deportes">
        <label for="deportes">Deportes</label><br>
        <input type="checkbox" id="lectura" name="preferencias[]" value="lectura">
        <label for="lectura">Lectura</label><br><br>

        <!-- Comentarios -->
        <h2>Comentarios</h2>
        <textarea id="comentarios" name="comentarios" rows="4" cols="50"></textarea><br><br>

        <!-- Botón Enviar -->
        <input type="submit" value="Enviar">
    </form>

</body>
</html>
